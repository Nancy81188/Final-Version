name: Build Saber Accounting Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  # write: only used by the last step, which publishes a Release when the workflow is run by hand on main.
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  # 2.9.52: optional code signing. Add the repository secrets SIGN_CERT_PFX_BASE64 (the .pfx certificate in base64)
  # and SIGN_CERT_PASSWORD; while they are missing the signing steps are skipped and the build works as before.
  SIGN_CERT: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
  SIGN_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v5

      # 2.9.51: stop at once when the upload landed in a sub-folder (the root would still hold the old version)
      # or when the program and the installer carry different versions. The version is shown in the run summary.
      - name: Check repository layout and version
        id: version
        shell: pwsh
        run: |
          foreach ($file in @("run_desktop.py", "app_runtime.py", "installer.iss")) {
            if (-not (Test-Path $file)) { throw "$file is missing at the top of the repository. Upload the CONTENT of the replitt-main folder, not the folder itself." }
          }
          $nested = Get-ChildItem -Directory | Where-Object { Test-Path (Join-Path $_.FullName "installer.iss") }
          if ($nested) { throw "A second copy of the program was found in the folder '$($nested[0].Name)'. Delete that folder and upload the files at the top of the repository." }
          $installer = (Select-String -Path installer.iss -Pattern '#define MyAppVersion "([^"]+)"').Matches[0].Groups[1].Value
          $program = (Select-String -Path app_runtime.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ($installer -ne $program) { throw "installer.iss says $installer but app_runtime.py says $program." }
          "version=$installer" >> $env:GITHUB_OUTPUT
          "## Building Saber Accounting $installer" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Building Saber Accounting $installer"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build requirements
        run: python -m pip install -r requirements.txt

      - name: Prepare bundled offline OCR (English and Arabic)
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress --version=5.5.0.20241111
          $engine = "Assets\ocr\engine"
          $tessdata = "Assets\ocr\tessdata"
          New-Item -ItemType Directory -Force -Path $engine, $tessdata | Out-Null
          $tesseract = (Get-Command tesseract.exe -ErrorAction Stop).Source
          $tesseractRoot = Split-Path -Parent $tesseract
          Copy-Item $tesseract $engine
          Copy-Item (Join-Path $tesseractRoot "*.dll") $engine
          Copy-Item (Join-Path $tesseractRoot "tessdata\eng.traineddata") $tessdata
          # 2.9.97: page orientation (a phone photo of a bill taken sideways); the program also tries 90 / 270 without it
          if (Test-Path (Join-Path $tesseractRoot "tessdata\osd.traineddata")) { Copy-Item (Join-Path $tesseractRoot "tessdata\osd.traineddata") $tessdata }
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/ara.traineddata" `
            -OutFile (Join-Path $tessdata "ara.traineddata")
          if (-not (Test-Path (Join-Path $tessdata "ara.traineddata"))) {
            throw "Arabic Tesseract language data was not downloaded."
          }

      - name: Run all tests
        run: python -m unittest discover -v -p "test_*.py"

      - name: Build standalone application (data service included)
        shell: pwsh
        run: |
            # 2.9.46: every program module in the repository is added automatically (no workflow edit for new files).
            $modules = Get-ChildItem -Path . -Filter *.py -File | Where-Object { $_.Name -notlike 'test_*' -and $_.Name -ne 'run_desktop.py' } | ForEach-Object { '--hidden-import'; $_.BaseName }
            Write-Host "Program modules included: $(($modules | Where-Object { $_ -ne '--hidden-import' }) -join ', ')"
            pyinstaller --noconfirm --clean --onedir --windowed --noupx --icon Assets/saber.ico @modules `
            --add-data "Assets/saber.ico;assets" --add-data "Assets/Saber_for_Audit_logo.png;assets" --add-data "Assets/user_guide.html;assets" --add-data "Assets/fonts;assets/fonts" --add-data "Assets/payroll_forms;Assets/payroll_forms" --add-data "Assets/ocr;ocr" `
            --hidden-import arabic_reshaper --hidden-import bidi --hidden-import bidi.algorithm --collect-data arabic_reshaper `
            --hidden-import payroll_reports --hidden-import vat_return --hidden-import desktop_final --hidden-import desktop_brains --hidden-import ledger_reports --hidden-import desktop_dimensions --hidden-import desktop_stage3 --hidden-import ai_mapper --hidden-import ai_service --hidden-import pdf_import --hidden-import pypdf --hidden-import pypdfium2 --hidden-import pytesseract --collect-all pypdfium2 --collect-all pypdfium2_raw --hidden-import year_end --hidden-import cnss_forms --hidden-import cnss_forms_ui --hidden-import party_similarity --hidden-import pdf_form_editor --hidden-import desktop_assets --hidden-import report_export --hidden-import payroll_excel_forms --hidden-import lebanese_payroll --hidden-import inventory --hidden-import fixed_assets --hidden-import desktop_inventory --hidden-import desktop_v22 --hidden-import chart_extra --hidden-import invoice_calc --hidden-import tafqeet --hidden-import business_reports --hidden-import financial_projection --hidden-import financial_statements --hidden-import app_runtime --hidden-import desktop_common --hidden-import desktop_invoices --hidden-import desktop_parties --hidden-import desktop_payroll --hidden-import desktop_reports --hidden-import desktop_settings --hidden-import desktop_stage3_common --hidden-import desktop_purchases --hidden-import desktop_asset_register --hidden-import desktop_expenses --hidden-import desktop_brains_common --hidden-import desktop_balance_reports --hidden-import desktop_payroll_sheet --hidden-import payroll_lines --hidden-import payroll_official --hidden-import office_tls --hidden-import vat_ledgers --hidden-import audit_chain --hidden-import audit_report --hidden-import desktop_attachments --hidden-import tax_review `
            --name SaberAccounting run_desktop.py

      - name: Verify application and offline PDF reading files
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\SaberAccounting\SaberAccounting.exe")) {
            throw "PyInstaller did not produce dist\SaberAccounting\SaberAccounting.exe - check the build step above."
          }
          $bundle = "dist\SaberAccounting\_internal"
          # Check the exact paths used by the frozen app and pypdfium2_raw.
          foreach ($relativePath in @(
            "ocr\engine\tesseract.exe",
            "ocr\tessdata\eng.traineddata",
            "ocr\tessdata\ara.traineddata",
            "pypdfium2_raw\pdfium.dll",
            "pypdfium2_raw\version.json"
          )) {
            $path = Join-Path $bundle $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing packaged OCR/PDFium file: $path. Check PyInstaller --add-data and --collect-all settings."
            }
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Empty packaged OCR/PDFium file: $path. Check the staged files and PyInstaller build."
            }
            Write-Host "OK: $path"
          }

      # Must succeed: the installer's "daily backups" option runs this program.
      - name: Build background backup service
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon Assets/saber.ico `
            --hidden-import inventory --hidden-import chart_extra --hidden-import lebanese_accounts --hidden-import lebanese_payroll --hidden-import app_runtime `
            --name SaberAccountingBackup backup_service.py

      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
            Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Inno Setup 6"
          }

      - name: Sign programs (only when a certificate is set)
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "saber-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found on the build machine." }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          foreach ($file in @("dist\SaberAccounting\SaberAccounting.exe", "dist\SaberAccountingBackup.exe")) {
            if (Test-Path $file) {
              & $signtool.FullName sign /f $pfx /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file
              if ($LASTEXITCODE -ne 0) { throw "Signing $file failed." }
            }
          }

      - name: Create Windows installer
        run: iscc installer.iss

      - name: Sign the installer (only when a certificate is set)
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f $env:SIGN_PFX /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 installer-output\SaberAccountingSetup.exe
          if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed." }
          Remove-Item $env:SIGN_PFX -Force

      - name: Upload installer
        uses: actions/upload-artifact@v6  # 2.9.73: v4 ran on the deprecated Node.js 20
        with:
          name: SaberAccountingSetup-${{ steps.version.outputs.version }}
          path: installer-output/SaberAccountingSetup.exe
          if-no-files-found: error
          retention-days: 30

      # 2.9.42: "Run workflow" on main also publishes a GitHub Release (vX.Y.Z) with the installer and its
      # SHA-256. The program's update check reads the newest Release. Pushes and pull requests never publish.
      - name: Publish release for the update check
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path installer.iss -Pattern '#define MyAppVersion "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          $installer = "installer-output/SaberAccountingSetup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          Set-Content -Path "installer-output/SaberAccountingSetup.exe.sha256" -Value "$hash  SaberAccountingSetup.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer "installer-output/SaberAccountingSetup.exe.sha256" --clobber
          } else {
            gh release create $tag $installer "installer-output/SaberAccountingSetup.exe.sha256" --title "Saber Accounting $version" --notes "See README.md, section Version $version. SHA-256: $hash"
          }
